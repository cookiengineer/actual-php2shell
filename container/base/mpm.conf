# Single prefork worker so producer/consumer requests deterministically land on
# the same worker (reproducibility aid; the advisory states multiple workers
# only reduce per-request success, they do not remove the condition).
<IfModule mpm_prefork_module>
    StartServers       1
    MinSpareServers    1
    MaxSpareServers    1
    ServerLimit        1
    MaxRequestWorkers  1
    MaxConnectionsPerChild 0
</IfModule>
