; PHP 8.5.11 victim configuration.
;
; Kept at production defaults so the exploit matches the advisories'
; "default configuration" claim, with two deliberate choices:
;   - display_errors=On  (the info-leak bytes are returned in the error body)
;   - html_errors=Off    (do not HTML-escape / wrap leaked bytes)

[PHP]

; ---- limits used by the OOM primitive (CVE-2026-109618) ----
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M
max_file_uploads = 20
max_input_vars = 1000
max_input_nesting_level = 64

; ---- session upload progress (CVE-2026-109619 consumer) ----
session.upload_progress.enabled = On
session.upload_progress.cleanup = On

; ---- fatal error backtrace producer (CVE-2026-109619) ----
fatal_error_backtraces = On

; ---- error reporting: expose diagnostics/leaks to the client ----
display_errors = On
display_startup_errors = On
html_errors = Off
log_errors = Off
error_reporting = E_ALL

expose_php = On
