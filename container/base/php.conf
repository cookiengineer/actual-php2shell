# PHP as an Apache module (mod_php).
# LoadModule is provided by a2enmod php -> /etc/apache2/mods-available/php.load

<FilesMatch \.php$>
    SetHandler application/x-httpd-php
</FilesMatch>

<IfModule mod_php.c>
    # php.ini is read from /etc/php8/php.ini (set at build time).
    # Per-directory PHP_INI_ALL overrides below are applied before
    # php_request_startup() on mod_php, which is the INI-diagnostic consumer
    # path used by CVE-2026-109619.
    <Directory /var/www/html>
        # deliberately empty; the exploit may need no per-dir values
    </Directory>
</IfModule>
